app = "tebak-lagu-live"
primary_region = "sin"

[build]

[mounts]
  source = "tebak_lagu_data"
  destination = "/app/data"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
