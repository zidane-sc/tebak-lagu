app = "tebak-lagu-live"
primary_region = "sin"

[build]

[build.args]
  NEXT_PUBLIC_GOOGLE_CLIENT_ID = "697459395695-25m5q42d0b6bqflu3abcjsgvkg78ef0c.apps.googleusercontent.com"

[mounts]
  source = "tebak_lagu_data"
  destination = "/app/data"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NEXT_PUBLIC_GOOGLE_CLIENT_ID = "697459395695-25m5q42d0b6bqflu3abcjsgvkg78ef0c.apps.googleusercontent.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Without this a hung node keeps serving 5xx forever: auto_stop_machines is
  # off, so nothing would ever restart it. /api/health touches SQLite, so it
  # also catches a lost volume mount.
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    tls_skip_verify = false

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
